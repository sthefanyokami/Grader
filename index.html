<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grader Web - Registro de Notas</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            color: #333;
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            margin-bottom: 30px;
        }
        .btn { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-add { background: #3498db; color: #fff; width: 100%; font-size: 1.1em; margin-bottom: 20px; }
        .btn-add:hover { background: #2980b9; }
        .btn-add-eval { background: #2ecc71; color: #fff; margin-bottom: 15px; }
        .btn-add-eval:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; color: #fff; padding: 8px 12px; }
        .btn-danger:hover { background: #c0392b; }
        
        .subject-card { 
            background: #fff; 
            padding: 25px; 
            margin-bottom: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .subject-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .subject-header input { 
            font-size: 1.4em; 
            font-weight: bold; 
            border: none; 
            color: #2c3e50;
            width: 70%; 
            padding: 5px; 
            background: transparent;
        }
        .subject-header input:focus { outline: none; border-bottom: 2px solid #3498db; }
        
        .eval-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            align-items: center; 
            flex-wrap: wrap;
        }
        .eval-row input { 
            padding: 10px; 
            border: 1px solid #bdc3c7; 
            border-radius: 6px; 
            flex: 1;
            min-width: 120px;
        }
        
        .summary { 
            margin-top: 20px; 
            padding-top: 15px;
            border-top: 2px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            font-weight: bold; 
            font-size: 1.1em; 
        }
        .grade-good { color: #27ae60; }
        .grade-warning { color: #f39c12; }
        .grade-danger { color: #c0392b; }
        
        @media (max-width: 600px) {
            .eval-row { flex-direction: column; align-items: stretch; }
            .summary { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grader Web</h1>
        <button class="btn btn-add" id="addSubjectBtn">+ Agregar Nueva Materia</button>
        <div id="subjectsContainer"></div>
    </div>

    <script>
        // Cargar los datos de localStorage al iniciar, o crear un arreglo vacío
        let graderData = JSON.parse(localStorage.getItem('graderApp_Data')) || [];

        // Función central para guardar y refrescar la UI
        function saveData() {
            localStorage.setItem('graderApp_Data', JSON.stringify(graderData));
            render();
        }

        // Acciones CRUD para Materias
        function addSubject() {
            graderData.push({
                id: Date.now(),
                name: 'Nombre de la Materia',
                evals: []
            });
            saveData();
        }

        function deleteSubject(id) {
            if(confirm("¿Estás seguro de eliminar esta materia y todas sus notas?")) {
                graderData = graderData.filter(sub => sub.id !== id);
                saveData();
            }
        }

        function updateSubjectName(id, newName) {
            const sub = graderData.find(s => s.id === id);
            if(sub) sub.name = newName;
            saveData();
        }

        // Acciones CRUD para Evaluaciones
        function addEval(subjectId) {
            const sub = graderData.find(s => s.id === subjectId);
            if(sub) {
                sub.evals.push({ id: Date.now(), name: 'Parcial / Tarea', weight: 0, grade: 0 });
                saveData();
            }
        }

        function updateEval(subjectId, evalId, field, value) {
            const sub = graderData.find(s => s.id === subjectId);
            if(sub) {
                const ev = sub.evals.find(e => e.id === evalId);
                if(ev) {
                    ev[field] = field === 'name' ? value : parseFloat(value) || 0;
                    saveData();
                }
            }
        }

        function deleteEval(subjectId, evalId) {
            const sub = graderData.find(s => s.id === subjectId);
            if(sub) {
                sub.evals = sub.evals.filter(e => e.id !== evalId);
                saveData();
            }
        }

        // Renderizado del HTML en el DOM
        function render() {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';

            if (graderData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#7f8c8d;">No hay materias agregadas. Haz clic en el botón de arriba para comenzar.</p>';
                return;
            }

            graderData.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                
                let totalGrade = 0;
                let totalWeight = 0;

                let evalsHtml = sub.evals.map(ev => {
                    let calcGrade = (ev.grade * (ev.weight / 100));
                    totalGrade += calcGrade;
                    totalWeight += ev.weight;
                    
                    return `
                        <div class="eval-row">
                            <input type="text" value="${ev.name}" onchange="updateEval(${sub.id}, ${ev.id}, 'name', this.value)" placeholder="Nombre evaluación">
                            <input type="number" value="${ev.weight}" onchange="updateEval(${sub.id}, ${ev.id}, 'weight', this.value)" placeholder="Peso (%)" step="1" min="0" max="100" title="Porcentaje de la materia">
                            <input type="number" value="${ev.grade}" onchange="updateEval(${sub.id}, ${ev.id}, 'grade', this.value)" placeholder="Nota (0-20)" step="0.1" min="0" max="20" title="Calificación obtenida">
                            <button class="btn btn-danger" onclick="deleteEval(${sub.id}, ${ev.id})" title="Eliminar evaluación">X</button>
                        </div>
                    `;
                }).join('');

                let weightColor = totalWeight > 100 ? 'color: #c0392b;' : (totalWeight === 100 ? 'color: #27ae60;' : '');
                let gradeClass = totalGrade >= 9.5 ? 'grade-good' : (totalGrade >= 5 ? 'grade-warning' : 'grade-danger');

                card.innerHTML = `
                    <div class="subject-header">
                        <input type="text" value="${sub.name}" onchange="updateSubjectName(${sub.id}, this.value)">
                        <button class="btn btn-danger" onclick="deleteSubject(${sub.id})">Eliminar Materia</button>
                    </div>
                    <button class="btn btn-add-eval" onclick="addEval(${sub.id})">+ Agregar Nota</button>
                    <div class="evals-container">
                        ${evalsHtml}
                    </div>
                    <div class="summary">
                        <span>Porcentaje evaluado: <span style="${weightColor}">${totalWeight.toFixed(1)}% / 100%</span></span>
                        <span>Nota Acumulada: <span class="${gradeClass}">${totalGrade.toFixed(2)} / 20</span></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Listeners
        document.getElementById('addSubjectBtn').addEventListener('click', addSubject);
        
        // Render inicial
        render();
    </script>
</body>
</html>
