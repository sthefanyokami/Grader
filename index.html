<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grader Web - Control de Notas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js para reactividad ligera -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col" x-data="graderApp()">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'semesters'">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold text-xl">🎓</div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Grader Web</h1>
                    <p class="text-xs text-slate-400" x-text="viewTitle()"></p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="bg-slate-700/60 px-4 py-2 rounded-xl text-center border border-slate-600">
                    <span class="block text-xs text-slate-400">Promedio General</span>
                    <span class="text-lg font-bold text-indigo-400" x-text="calculateGlobalAverage()"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">

        <!-- VISTA 1: SEMESTRES -->
        <template x-if="currentView === 'semesters'">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-200">Mis Semestres</h2>
                    <button @click="openSemesterModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
                        <span>+ Nuevo Semestre</span>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="semester in semesters" :key="semester.id">
                        <div @click="selectSemester(semester)" class="bg-slate-800/80 border border-slate-700 hover:border-indigo-500/50 p-5 rounded-2xl cursor-pointer transition shadow-sm hover:shadow-md flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-lg font-bold text-indigo-300" x-text="semester.name"></h3>
                                    <button @click.stop="deleteSemester(semester.id)" class="text-slate-500 hover:text-rose-400 p-1">🗑️</button>
                                </div>
                                <p class="text-sm text-slate-400" x-text="semester.description || 'Sin descripción'"></p>
                            </div>
                            <div class="mt-6 pt-4 border-t border-slate-700/60 flex justify-between items-center">
                                <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Promedio Semestral</span>
                                <span class="text-xl font-bold text-emerald-400" x-text="getSemesterAverage(semester.id)"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="semesters.length === 0" class="text-center py-20 text-slate-500">
                    <p class="text-lg">No hay semestres registrados todavía.</p>
                    <p class="text-sm">Crea uno nuevo para empezar a registrar tus materias.</p>
                </div>
            </div>
        </template>

        <!-- VISTA 2: MATERIAS / CURSOS -->
        <template x-if="currentView === 'courses'">
            <div>
                <div class="flex items-center space-x-3 mb-6">
                    <button @click="currentView = 'semesters'" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-sm border border-slate-700 transition">← Volver</button>
                    <div>
                        <h2 class="text-2xl font-bold text-slate-200" x-text="selectedSemester?.name"></h2>
                        <p class="text-xs text-slate-400">Materias asociadas al semestre</p>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-slate-300">Materias</h3>
                    <button @click="openCourseModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30">
                        + Nueva Materia
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="course in currentCourses()" :key="course.id">
                        <div @click="selectCourse(course)" class="bg-slate-800/80 border border-slate-700 hover:border-indigo-500/50 p-5 rounded-2xl cursor-pointer transition shadow-sm flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="text-lg font-bold text-indigo-300" x-text="course.name"></h4>
                                    <button @click.stop="deleteCourse(course.id)" class="text-slate-500 hover:text-rose-400 p-1">🗑️</button>
                                </div>
                                <span class="inline-block bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-lg font-medium" x-text="'Créditos: ' + course.credits"></span>
                            </div>
                            <div class="mt-6 pt-4 border-t border-slate-700/60 flex justify-between items-center">
                                <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Promedio Materia</span>
                                <span class="text-xl font-bold text-emerald-400" x-text="getCourseAverage(course.id)"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="currentCourses().length === 0" class="text-center py-20 text-slate-500">
                    <p class="text-lg">No hay materias registradas en este semestre.</p>
                </div>
            </div>
        </template>

        <!-- VISTA 3: EVALUACIONES / NOTAS -->
        <template x-if="currentView === 'grades'">
            <div>
                <div class="flex items-center space-x-3 mb-6">
                    <button @click="currentView = 'courses'" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-sm border border-slate-700 transition">← Volver</button>
                    <div>
                        <h2 class="text-2xl font-bold text-slate-200" x-text="selectedCourse?.name"></h2>
                        <p class="text-xs text-slate-400">Evaluaciones y Ponderaciones</p>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-slate-300">Evaluaciones</h3>
                    <button @click="openGradeModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30">
                        + Nueva Evaluación
                    </button>
                </div>

                <!-- Tabla de notas -->
                <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-700/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                                <th class="p-4">Evaluación</th>
                                <th class="p-4">Nota</th>
                                <th class="p-4">Porcentaje (%)</th>
                                <th class="p-4 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/60 text-sm">
                            <template x-for="grade in currentGrades()" :key="grade.id">
                                <tr>
                                    <td class="p-4 font-medium text-slate-200" x-text="grade.name"></td>
                                    <td class="p-4 font-semibold text-indigo-400" x-text="grade.score"></td>
                                    <td class="p-4 text-slate-400" x-text="grade.percentage + '%'"></td>
                                    <td class="p-4 text-right">
                                        <button @click="deleteGrade(grade.id)" class="text-slate-500 hover:text-rose-400 p-1">🗑️</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div x-show="currentGrades().length === 0" class="text-center py-20 text-slate-500">
                    <p class="text-lg">No hay evaluaciones registradas en esta materia.</p>
                </div>
            </div>
        </template>
    </main>

    <!-- MODAL SEMESTRE -->
    <div x-show="showSemesterModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-slate-200">Nuevo Semestre</h3>
            <form @submit.prevent="saveSemester()">
                <div class="mb-4">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Nombre del Semestre</label>
                    <input type="text" x-model="newSemesterName" placeholder="Ej. Semestre 2026-1" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="mb-6">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Descripción (Opcional)</label>
                    <input type="text" x-model="newSemesterDesc" placeholder="Ej. Ingeniería UCAB" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" @click="showSemesterModal = false" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl transition">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL MATERIA -->
    <div x-show="showCourseModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-slate-200">Nueva Materia</h3>
            <form @submit.prevent="saveCourse()">
                <div class="mb-4">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Nombre de la Materia</label>
                    <input type="text" x-model="newCourseName" placeholder="Ej. Cálculo Numérico" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="mb-6">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Créditos / Peso</label>
                    <input type="number" x-model.number="newCourseCredits" placeholder="Ej. 4" min="1" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" @click="showCourseModal = false" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl transition">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EVALUACIÓN -->
    <div x-show="showGradeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-slate-200">Nueva Evaluación</h3>
            <form @submit.prevent="saveGrade()">
                <div class="mb-4">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Nombre de la Evaluación</label>
                    <input type="text" x-model="newGradeName" placeholder="Ej. Parcial 1" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Calificación (Nota)</label>
                    <input type="number" step="0.01" x-model.number="newGradeScore" placeholder="Ej. 18.5" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="mb-6">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Porcentaje (%)</label>
                    <input type="number" step="1" x-model.number="newGradePercentage" placeholder="Ej. 25" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" @click="showGradeModal = false" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl transition">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lógica de la Aplicación -->
    <script>
        function graderApp() {
            return {
                currentView: 'semesters',
                semesters: JSON.parse(localStorage.getItem('grader_semesters')) || [],
                courses: JSON.parse(localStorage.getItem('grader_courses')) || [],
                grades: JSON.parse(localStorage.getItem('grader_grades')) || [],

                selectedSemester: null,
                selectedCourse: null,

                showSemesterModal: false,
                newSemesterName: '',
                newSemesterDesc: '',

                showCourseModal: false,
                newCourseName: '',
                newCourseCredits: 3,

                showGradeModal: false,
                newGradeName: '',
                newGradeScore: '',
                newGradePercentage: '',

                saveData() {
                    localStorage.setItem('grader_semesters', JSON.stringify(this.semesters));
                    localStorage.setItem('grader_courses', JSON.stringify(this.courses));
                    localStorage.setItem('grader_grades', JSON.stringify(this.grades));
                },

                viewTitle() {
                    if (this.currentView === 'semesters') return 'Panel Principal';
                    if (this.currentView === 'courses') return this.selectedSemester?.name || '';
                    if (this.currentView === 'grades') return this.selectedCourse?.name || '';
                },

                openSemesterModal() {
                    this.newSemesterName = '';
                    this.newSemesterDesc = '';
                    this.showSemesterModal = true;
                },

                saveSemester() {
                    this.semesters.push({
                        id: Date.now(),
                        name: this.newSemesterName,
                        description: this.newSemesterDesc
                    });
                    this.saveData();
                    this.showSemesterModal = false;
                },

                deleteSemester(id) {
                    if (confirm('¿Eliminar este semestre y todas sus materias?')) {
                        this.semesters = this.semesters.filter(s => s.id !== id);
                        this.courses = this.courses.filter(c => c.semesterId !== id);
                        this.saveData();
                    }
                },

                selectSemester(semester) {
                    this.selectedSemester = semester;
                    this.currentView = 'courses';
                },

                currentCourses() {
                    return this.courses.filter(c => c.semesterId === this.selectedSemester?.id);
                },

                openCourseModal() {
                    this.newCourseName = '';
                    this.newCourseCredits = 3;
                    this.showCourseModal = true;
                },

                saveCourse() {
                    this.courses.push({
                        id: Date.now(),
                        semesterId: this.selectedSemester.id,
                        name: this.newCourseName,
                        credits: this.newCourseCredits
                    });
                    this.saveData();
                    this.showCourseModal = false;
                },

                deleteCourse(id) {
                    if (confirm('¿Eliminar esta materia y sus calificaciones?')) {
                        this.courses = this.courses.filter(c => c.id !== id);
                        this.grades = this.grades.filter(g => g.courseId !== id);
                        this.saveData();
                    }
                },

                selectCourse(course) {
                    this.selectedCourse = course;
                    this.currentView = 'grades';
                },

                currentGrades() {
                    return this.grades.filter(g => g.courseId === this.selectedCourse?.id);
                },

                openGradeModal() {
                    this.newGradeName = '';
                    this.newGradeScore = '';
                    this.newGradePercentage = '';
                    this.showGradeModal = true;
                },

                saveGrade() {
                    this.grades.push({
                        id: Date.now(),
                        courseId: this.selectedCourse.id,
                        name: this.newGradeName,
                        score: parseFloat(this.newGradeScore),
                        percentage: parseInt(this.newGradePercentage)
                    });
                    this.saveData();
                    this.showGradeModal = false;
                },

                deleteGrade(id) {
                    this.grades = this.grades.filter(g => g.id !== id);
                    this.saveData();
                },

                getCourseAverage(courseId) {
                    const courseGrades = this.grades.filter(g => g.courseId === courseId);
                    if (courseGrades.length === 0) return '0.00';
                    let totalScore = 0;
                    let totalWeight = 0;
                    courseGrades.forEach(g => {
                        totalScore += (g.score * g.percentage);
                        totalWeight += g.percentage;
                    });
                    if (totalWeight === 0) return '0.00';
                    return (totalScore / totalWeight).toFixed(2);
                },

                getSemesterAverage(semesterId) {
                    const semCourses = this.courses.filter(c => c.semesterId === semesterId);
                    if (semCourses.length === 0) return '0.00';
                    let sum = 0;
                    let count = 0;
                    semCourses.forEach(c => {
                        const avg = parseFloat(this.getCourseAverage(c.id));
                        sum += avg;
                        count++;
                    });
                    return count > 0 ? (sum / count).toFixed(2) : '0.00';
                },

                calculateGlobalAverage() {
                    if (this.courses.length === 0) return '0.00';
                    let sum = 0;
                    this.courses.forEach(c => {
                        sum += parseFloat(this.getCourseAverage(c.id));
                    });
                    return (sum / this.courses.length).toFixed(2);
                }
            }
        }
    </script>
</body>
</html>
