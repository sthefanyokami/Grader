<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Académico</title>
    <style>
        body {
            display: flex;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .nav-btn {
            background: none;
            color: white;
            border: none;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
        }

        .nav-btn:hover {
            background-color: #34495e;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            position: relative;
            background-color: #ecf0f1;
        }

        /* Lógica de Pestañas */
        .pestana {
            display: none; /* Oculta todas las pestañas por defecto */
        }

        .pestana.active {
            display: block; /* Muestra solo la pestaña activa */
        }

        /* Botón Flotante (+) */
        .fab-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
        }

        .fab-btn:hover {
            background-color: #2980b9;
        }

        /* Modal (Fondo oscuro y caja central) */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
        }

        .opcion-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Menú Lateral -->
    <div class="sidebar">
        <button class="nav-btn" onclick="cambiarPestana('registro-academico')">Registro Académico</button>
        <button class="nav-btn" onclick="cambiarPestana('resumen')">Resumen</button>
        <button class="nav-btn" onclick="cambiarPestana('configuracion')">Configuración</button>
    </div>

    <!-- Área de Contenido -->
    <div class="main-content">
        
        <!-- Pestaña: Registro Académico -->
        <div id="registro-academico" class="pestana active">
            <h2>Registro Académico</h2>
            <p>Aquí se visualizarán tus semestres y materias...</p>
        </div>

        <!-- Pestaña: Resumen -->
        <div id="resumen" class="pestana">
            <h2>Resumen</h2>
            <p>Aquí verás tus promedios e historial...</p>
        </div>

        <!-- Pestaña: Configuración -->
        <div id="configuracion" class="pestana">
            <h2>Configuración</h2>
            <p>Opciones de la cuenta y la página...</p>
        </div>

        <!-- Botón flotante de suma (+) -->
        <button class="fab-btn" onclick="abrirModal()">+</button>
    </div>

    <!-- Modal para agregar registros (Oculto por defecto) -->
    <div id="modal-agregar" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h3>¿Qué deseas agregar?</h3>
            <button class="opcion-btn">Agregar Semestre</button>
            <button class="opcion-btn">Agregar Materia</button>
            <button class="opcion-btn">Agregar Evaluación</button>
        </div>
    </div>

    <script>
        // Función para cambiar el contenido principal desde el menú izquierdo
        function cambiarPestana(idPestana) {
            // 1. Ocultar todas las pestañas
            let pestanas = document.querySelectorAll('.pestana');
            pestanas.forEach(function(pestana) {
                pestana.classList.remove('active');
            });

            // 2. Mostrar la pestaña seleccionada
            let pestanaActiva = document.getElementById(idPestana);
            if (pestanaActiva) {
                pestanaActiva.classList.add('active');
            }
        }

        // Funciones para el Modal del botón de suma (+)
        function abrirModal() {
            document.getElementById('modal-agregar').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modal-agregar').style.display = 'none';
        }

        // Cerrar el modal si el usuario hace clic fuera de la caja blanca
        window.onclick = function(event) {
            let modal = document.getElementById('modal-agregar');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
