<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grader Estelar - UCAB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Quicksand:wght@400;600&display=swap');

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: radial-gradient(circle at top right, #1b0e33, #0a0a1a, #050b14);
            background-attachment: fixed;
            margin: 0; 
            padding: 20px; 
            color: #e0e6ed;
        }

        .container { 
            max-width: 900px; 
            margin: auto; 
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; margin: 0; }
        
        .header-title {
            text-align: center; 
            color: #d8caff; 
            text-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .global-gpa {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 20px rgba(72, 61, 139, 0.4);
            backdrop-filter: blur(5px);
        }

        .global-gpa h2 { color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.4); font-size: 2em; }

        /* Barra de acciones generales (Guardar/Abrir/Nuevo) */
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        
        .btn-add-sem { 
            background: linear-gradient(45deg, #483d8b, #2f4f4f); 
            color: #fff; 
            flex: 1;
            box-shadow: 0 4px 10px rgba(72, 61, 139, 0.5);
        }
        .btn-add-sem:hover { background: linear-gradient(45deg, #5a4baf, #3b6363); transform: translateY(-2px); }

        .btn-file {
            background: rgba(72, 61, 139, 0.4);
            color: #b39ddb;
            border: 1px solid #7b68ee;
        }
        .btn-file:hover { background: rgba(72, 61, 139, 0.8); color: #fff; }
        
        .btn-add-sub { background: rgba(72, 61, 139, 0.6); color: #fff; border: 1px solid #7b68ee; margin-top: 15px; width: 100%;}
        .btn-add-sub:hover { background: rgba(72, 61, 139, 0.9); }
        
        .btn-add-eval { background: rgba(0, 206, 209, 0.2); color: #00ffff; border: 1px solid #00ffff; margin-bottom: 15px; }
        .btn-add-eval:hover { background: rgba(0, 206, 209, 0.4); }
        
        .btn-danger { background: rgba(220, 20, 60, 0.6); color: #fff; padding: 6px 10px; border: 1px solid #dc143c; }
        .btn-danger:hover { background: rgba(220, 20, 60, 0.9); box-shadow: 0 0 10px rgba(220, 20, 60, 0.5); }

        /* Pestañas de Semestres */
        .semester-tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(123, 104, 238, 0.3);
        }

        .semester-tab {
            background: rgba(15, 15, 30, 0.5);
            border: 1px solid rgba(123, 104, 238, 0.3);
            color: #a9a9a9;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .semester-tab:hover {
            background: rgba(123, 104, 238, 0.2);
            color: #fff;
        }

        .semester-tab.active {
            background: rgba(15, 15, 30, 0.9);
            border-color: #7b68ee;
            border-bottom: 2px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 -4px 10px rgba(0, 255, 255, 0.1);
        }

        input {
            font-family: 'Quicksand', sans-serif;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #483d8b;
            color: #e0e6ed;
            border-radius: 6px;
            padding: 8px;
            transition: border 0.3s;
        }
        input:focus { outline: none; border-color: #00ffff; box-shadow: 0 0 8px rgba(0, 255, 255, 0.3); }

        /* Estilos de Semestre Activo */
        .semester-block {
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid #7b68ee;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        
        .semester-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(123, 104, 238, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .semester-header input {
            font-family: 'Cinzel', serif;
            font-size: 1.5em;
            font-weight: bold;
            color: #b39ddb;
            background: transparent;
            border: none;
            width: 50%;
        }
        .semester-header input:focus { border-bottom: 1px solid #00ffff; background: rgba(0,0,0,0.2); }

        .semester-info-box {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .semester-gpa {
            font-size: 1.1em;
            color: #40e0d0;
            text-shadow: 0 0 5px rgba(64, 224, 208, 0.4);
        }

        /* Estilos de Materia */
        .subject-card { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        
        .subject-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        
        .subject-header input { 
            font-size: 1.2em; 
            font-weight: 600; 
            width: 60%; 
            border: none;
            background: transparent;
            color: #fff;
        }
        .subject-header input:focus { border-bottom: 1px solid #7b68ee; background: rgba(0,0,0,0.2); }
        
        .eval-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 10px; 
            align-items: center; 
            flex-wrap: wrap;
        }
        .eval-row input { flex: 1; min-width: 100px; }
        
        /* Barra de progreso estética */
        .progress-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            height: 12px;
            margin-top: 15px;
            overflow: hidden;
            border: 1px solid rgba(123, 104, 238, 0.3);
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #7b68ee, #00ffff);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            transition: width 0.4s ease, background 0.4s ease;
        }
        .progress-fill.over { background: linear-gradient(90deg, #ff4500, #dc143c); box-shadow: 0 0 10px rgba(220, 20, 60, 0.5); }
        .progress-fill.complete { background: linear-gradient(90deg, #32cd32, #00fa9a); box-shadow: 0 0 10px rgba(0, 250, 154, 0.5); }

        .summary { 
            margin-top: 15px; 
            display: flex;
            justify-content: space-between;
            font-size: 1.05em; 
            color: #a9a9a9;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .grade-good { color: #00fa9a; text-shadow: 0 0 5px rgba(0, 250, 154, 0.4); }
        .grade-warning { color: #ffd700; }
        .grade-danger { color: #ff4500; }

        @media (max-width: 700px) {
            .eval-row { flex-direction: column; align-items: stretch; }
            .semester-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .semester-header input { width: 100%; }
            .summary { flex-direction: column; gap: 8px; }
            .actions-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">🌙 Grader Estelar ✨</h1>
        
        <div class="global-gpa">
            <h3>Promedio General Acumulado</h3>
            <h2 id="globalGpaDisplay">0.00 / 20</h2>
        </div>

        <!-- Barra de Acciones de Semestres y Archivos -->
        <div class="actions-bar">
            <button class="btn btn-add-sem" onclick="addSemester()">+ Nuevo Semestre Cósmico</button>
            <button class="btn btn-file" onclick="saveToFile()">💾 Guardar Datos</button>
            <button class="btn btn-file" onclick="document.getElementById('fileInput').click()">📂 Abrir Datos</button>
            <input type="file" id="fileInput" style="display: none;" accept=".json" onchange="loadFromFile(event)">
        </div>

        <!-- Pestañas de Semestres -->
        <div id="semesterTabsContainer" class="semester-tabs-container"></div>

        <!-- Contenedor del Semestre Activo -->
        <div id="semestersContainer"></div>
    </div>

    <script>
        let graderData = JSON.parse(localStorage.getItem('lunaGrader_Data')) || [
            {
                id: Date.now(),
                name: 'Semestre 1',
                subjects: [
                    {
                        id: Date.now() + 1,
                        name: 'Introducción a las telecomunicaciones',
                        evals: []
                    }
                ]
            }
        ];

        let activeSemesterId = graderData.length > 0 ? graderData[0].id : null;

        function saveData() {
            localStorage.setItem('lunaGrader_Data', JSON.stringify(graderData));
            render();
        }

        // --- FUNCIONES DE GUARDAR Y ABRIR ARCHIVO ---
        function saveToFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(graderData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "grader_estelar_ucab.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    if (Array.isArray(parsedData)) {
                        graderData = parsedData;
                        activeSemesterId = graderData.length > 0 ? graderData[0].id : null;
                        saveData();
                        alert("✨ ¡Semestres cargados con éxito desde el archivo!");
                    } else {
                        alert("⚠️ El archivo no tiene un formato válido.");
                    }
                } catch (err) {
                    alert("❌ Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        }

        // --- CRUD SEMESTRES ---
        function addSemester() {
            const newSem = { id: Date.now(), name: `Semestre ${graderData.length + 1}`, subjects: [] };
            graderData.push(newSem);
            activeSemesterId = newSem.id;
            saveData();
        }

        function deleteSemester(semId) {
            if(confirm("🌙 ¿Deseas desvanecer este semestre y todas sus estrellas (materias)?")) {
                graderData = graderData.filter(s => s.id !== semId);
                if (activeSemesterId === semId) {
                    activeSemesterId = graderData.length > 0 ? graderData[0].id : null;
                }
                saveData();
            }
        }

        function updateSemesterName(semId, newName) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) sem.name = newName;
            saveData();
        }

        // --- CRUD MATERIAS ---
        function addSubject(semId) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                sem.subjects.push({ id: Date.now(), name: 'Nueva Materia', evals: [] });
                saveData();
            }
        }

        function deleteSubject(semId, subId) {
            if(confirm("✨ ¿Seguro que deseas eliminar esta materia?")) {
                const sem = graderData.find(s => s.id === semId);
                if(sem) sem.subjects = sem.subjects.filter(sub => sub.id !== subId);
                saveData();
            }
        }

        function updateSubjectName(semId, subId, newName) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) sub.name = newName;
            }
            saveData();
        }

        // --- CRUD EVALUACIONES ---
        function addEval(semId, subId) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) sub.evals.push({ id: Date.now(), name: 'Evaluación', weight: 0, grade: 0 });
            }
            saveData();
        }

        function updateEval(semId, subId, evalId, field, value) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) {
                    const ev = sub.evals.find(e => e.id === evalId);
                    if(ev) ev[field] = field === 'name' ? value : parseFloat(value) || 0;
                }
            }
            saveData();
        }

        function deleteEval(semId, subId, evalId) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) sub.evals = sub.evals.filter(e => e.id !== evalId);
            }
            saveData();
        }

        // --- RENDERIZADO Y CÁLCULOS ---
        function render() {
            const tabsContainer = document.getElementById('semesterTabsContainer');
            const container = document.getElementById('semestersContainer');
            
            tabsContainer.innerHTML = '';
            container.innerHTML = '';

            let globalTotalGrades = 0;
            let globalSubjectCount = 0;

            if (graderData.length === 0) {
                tabsContainer.innerHTML = '';
                container.innerHTML = '<p style="text-align:center; color:#7b68ee;">El cielo nocturno está vacío. Agrega un semestre para comenzar.</p>';
                document.getElementById('globalGpaDisplay').innerText = `0.00 / 20`;
                return;
            }

            // Asegurar que activeSemesterId sea válido
            if (!graderData.some(s => s.id === activeSemesterId)) {
                activeSemesterId = graderData[0].id;
            }

            // Renderizar pestañas de semestres
            graderData.forEach(sem => {
                const tab = document.createElement('div');
                tab.className = `semester-tab ${sem.id === activeSemesterId ? 'active' : ''}`;
                tab.innerText = sem.name || 'Sin Nombre';
                tab.onclick = () => {
                    activeSemesterId = sem.id;
                    render();
                };
                tabsContainer.appendChild(tab);
            });

            // Calcular promedio general global en base a todas las materias de todos los semestres
            graderData.forEach(sem => {
                sem.subjects.forEach(sub => {
                    let totalGrade = sub.evals.reduce((acc, ev) => acc + (ev.grade * (ev.weight / 100)), 0);
                    globalTotalGrades += totalGrade;
                    globalSubjectCount++;
                });
            });

            // Renderizar contenido del semestre activo
            const activeSem = graderData.find(s => s.id === activeSemesterId);
            if (activeSem) {
                const semBlock = document.createElement('div');
                semBlock.className = 'semester-block';
                
                let semTotalGrades = 0;
                let semSubjectCount = activeSem.subjects.length;
                let semTotalWeightEvaluated = 0;
                let semRemainingWeightTotal = 0;

                let subjectsHtml = '';

                activeSem.subjects.forEach(sub => {
                    let totalGrade = 0;
                    let totalWeight = 0;

                    let evalsHtml = sub.evals.map(ev => {
                        let calcGrade = (ev.grade * (ev.weight / 100));
                        totalGrade += calcGrade;
                        totalWeight += ev.weight;
                        
                        return `
                            <div class="eval-row">
                                <input type="text" value="${ev.name}" onchange="updateEval(${activeSem.id}, ${sub.id}, ${ev.id}, 'name', this.value)">
                                <input type="number" value="${ev.weight}" onchange="updateEval(${activeSem.id}, ${sub.id}, ${ev.id}, 'weight', this.value)" placeholder="Peso %" min="0" max="100">
                                <input type="number" value="${ev.grade}" onchange="updateEval(${activeSem.id}, ${sub.id}, ${ev.id}, 'grade', this.value)" placeholder="Nota (0-20)" step="0.1" min="0" max="20">
                                <button class="btn btn-danger" onclick="deleteEval(${activeSem.id}, ${sub.id}, ${ev.id})">✖</button>
                            </div>
                        `;
                    }).join('');

                    semTotalGrades += totalGrade;
                    semTotalWeightEvaluated += totalWeight;
                    
                    let remainingWeight = Math.max(0, 100 - totalWeight);
                    semRemainingWeightTotal += remainingWeight;

                    let barClass = 'progress-fill';
                    if (totalWeight > 100) barClass += ' over';
                    else if (totalWeight === 100) barClass += ' complete';
                    
                    let gradeClass = totalGrade >= 9.5 ? 'grade-good' : (totalGrade >= 5 ? 'grade-warning' : 'grade-danger');

                    subjectsHtml += `
                        <div class="subject-card">
                            <div class="subject-header">
                                <input type="text" value="${sub.name}" onchange="updateSubjectName(${activeSem.id}, ${sub.id}, this.value)">
                                <button class="btn btn-danger" onclick="deleteSubject(${activeSem.id}, ${sub.id})">Eliminar Materia</button>
                            </div>
                            <button class="btn btn-add-eval" onclick="addEval(${activeSem.id}, ${sub.id})">+ Añadir Evaluación</button>
                            
                            <div class="evals-container">
                                ${evalsHtml}
                            </div>
                            
                            <div class="progress-container" title="Porcentaje evaluado: ${totalWeight.toFixed(1)}%">
                                <div class="${barClass}" style="width: ${Math.min(totalWeight, 100)}%;"></div>
                            </div>
                            
                            <div class="summary">
                                <span>Progreso: <span style="color: ${totalWeight > 100 ? '#ff4500' : '#fff'}">${totalWeight.toFixed(1)}% / 100%</span></span>
                                <span>Falta por evaluar: <strong style="color: #00ffff;">${remainingWeight.toFixed(1)}%</strong></span>
                                <span>Nota Acumulada: <strong class="${gradeClass}">${totalGrade.toFixed(2)} / 20</strong></span>
                            </div>
                        </div>
                    `;
                });

                let semGpa = semSubjectCount > 0 ? (semTotalGrades / semSubjectCount) : 0;
                let avgRemaining = semSubjectCount > 0 ? (semRemainingWeightTotal / semSubjectCount) : 0;

                semBlock.innerHTML = `
                    <div class="semester-header">
                        <input type="text" value="${activeSem.name}" onchange="updateSemesterName(${activeSem.id}, this.value)">
                        <div class="semester-info-box">
                            <div class="semester-gpa">Promedio Semestre: <strong>${semGpa.toFixed(2)}</strong></div>
                            <div class="semester-gpa" style="color: #00ffff; font-size: 0.95em;" title="Promedio de puntos restantes por evaluar por materia">Faltante Promedio: <strong>${avgRemaining.toFixed(1)}%</strong></div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteSemester(${activeSem.id})">Eliminar Semestre</button>
                    </div>
                    ${subjectsHtml}
                    <button class="btn btn-add-sub" onclick="addSubject(${activeSem.id})">+ Agregar Materia a este Semestre</button>
                `;
                container.appendChild(semBlock);
            }

            let globalGpa = globalSubjectCount > 0 ? (globalTotalGrades / globalSubjectCount) : 0;
            document.getElementById('globalGpaDisplay').innerText = `${globalGpa.toFixed(2)} / 20`;
        }

        // Render inicial
        render();
    </script>
</body>
</html>
