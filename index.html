<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grader Estelar - UCAB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Quicksand:wght@400;600&display=swap');

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            /* Fondo inspirado en el cielo nocturno de la Princesa Luna */
            background: radial-gradient(circle at top right, #1b0e33, #0a0a1a, #050b14);
            background-attachment: fixed;
            margin: 0; 
            padding: 20px; 
            color: #e0e6ed;
        }

        .container { 
            max-width: 900px; 
            margin: auto; 
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; margin: 0; }
        
        .header-title {
            text-align: center; 
            color: #d8caff; 
            text-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .global-gpa {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 20px rgba(72, 61, 139, 0.4);
            backdrop-filter: blur(5px);
        }

        .global-gpa h2 { color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.4); font-size: 2em; }

        .btn { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        
        .btn-add-sem { 
            background: linear-gradient(45deg, #483d8b, #2f4f4f); 
            color: #fff; 
            width: 100%; 
            font-size: 1.1em; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 10px rgba(72, 61, 139, 0.5);
        }
        .btn-add-sem:hover { background: linear-gradient(45deg, #5a4baf, #3b6363); transform: translateY(-2px); }
        
        .btn-add-sub { background: rgba(72, 61, 139, 0.6); color: #fff; border: 1px solid #7b68ee; margin-top: 15px;}
        .btn-add-sub:hover { background: rgba(72, 61, 139, 0.9); }
        
        .btn-add-eval { background: rgba(0, 206, 209, 0.2); color: #00ffff; border: 1px solid #00ffff; margin-bottom: 15px; }
        .btn-add-eval:hover { background: rgba(0, 206, 209, 0.4); }
        
        .btn-danger { background: rgba(220, 20, 60, 0.6); color: #fff; padding: 6px 10px; border: 1px solid #dc143c; }
        .btn-danger:hover { background: rgba(220, 20, 60, 0.9); box-shadow: 0 0 10px rgba(220, 20, 60, 0.5); }

        input {
            font-family: 'Quicksand', sans-serif;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #483d8b;
            color: #e0e6ed;
            border-radius: 6px;
            padding: 8px;
            transition: border 0.3s;
        }
        input:focus { outline: none; border-color: #00ffff; box-shadow: 0 0 8px rgba(0, 255, 255, 0.3); }

        /* Estilos de Semestre */
        .semester-block {
            background: rgba(15, 15, 30, 0.7);
            border-left: 4px solid #7b68ee;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        
        .semester-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(123, 104, 238, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .semester-header input {
            font-family: 'Cinzel', serif;
            font-size: 1.5em;
            font-weight: bold;
            color: #b39ddb;
            background: transparent;
            border: none;
            width: 50%;
        }
        .semester-header input:focus { border-bottom: 1px solid #00ffff; }

        .semester-gpa {
            font-size: 1.2em;
            color: #40e0d0;
            text-shadow: 0 0 5px rgba(64, 224, 208, 0.4);
        }

        /* Estilos de Materia */
        .subject-card { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        .subject-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        
        .subject-header input { 
            font-size: 1.2em; 
            font-weight: 600; 
            width: 60%; 
            border: none;
            background: transparent;
            color: #fff;
        }
        .subject-header input:focus { border-bottom: 1px solid #7b68ee; }
        
        .eval-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 10px; 
            align-items: center; 
            flex-wrap: wrap;
        }
        .eval-row input { flex: 1; min-width: 100px; }
        
        /* Barra de progreso estética */
        .progress-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            height: 12px;
            margin-top: 15px;
            overflow: hidden;
            border: 1px solid rgba(123, 104, 238, 0.3);
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #7b68ee, #00ffff);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            transition: width 0.4s ease, background 0.4s ease;
        }
        .progress-fill.over { background: linear-gradient(90deg, #ff4500, #dc143c); box-shadow: 0 0 10px rgba(220, 20, 60, 0.5); }
        .progress-fill.complete { background: linear-gradient(90deg, #32cd32, #00fa9a); box-shadow: 0 0 10px rgba(0, 250, 154, 0.5); }

        .summary { 
            margin-top: 15px; 
            display: flex;
            justify-content: space-between;
            font-size: 1.05em; 
            color: #a9a9a9;
        }
        
        .grade-good { color: #00fa9a; text-shadow: 0 0 5px rgba(0, 250, 154, 0.4); }
        .grade-warning { color: #ffd700; }
        .grade-danger { color: #ff4500; }

        @media (max-width: 700px) {
            .eval-row { flex-direction: column; align-items: stretch; }
            .semester-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .semester-header input { width: 100%; }
            .summary { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">🌙 Grader Estelar ✨</h1>
        
        <div class="global-gpa">
            <h3>Promedio General Acumulado</h3>
            <h2 id="globalGpaDisplay">0.00 / 20</h2>
        </div>

        <button class="btn btn-add-sem" onclick="addSemester()">+ Nuevo Semestre Cósmico</button>
        <div id="semestersContainer"></div>
    </div>

    <script>
        // Estructura anidada: Semestres -> Materias -> Evaluaciones
        let graderData = JSON.parse(localStorage.getItem('lunaGrader_Data')) || [
            {
                id: Date.now(),
                name: 'Semestre 1',
                subjects: [
                    {
                        id: Date.now() + 1,
                        name: 'Introducción a las telecomunicaciones',
                        evals: []
                    }
                ]
            }
        ];

        function saveData() {
            localStorage.setItem('lunaGrader_Data', JSON.stringify(graderData));
            render();
        }

        // --- CRUD SEMESTRES ---
        function addSemester() {
            graderData.push({ id: Date.now(), name: 'Nuevo Semestre', subjects: [] });
            saveData();
        }

        function deleteSemester(semId) {
            if(confirm("🌙 ¿Deseas desvanecer este semestre y todas sus estrellas (materias)?")) {
                graderData = graderData.filter(s => s.id !== semId);
                saveData();
            }
        }

        function updateSemesterName(semId, newName) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) sem.name = newName;
            saveData();
        }

        // --- CRUD MATERIAS ---
        function addSubject(semId) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                sem.subjects.push({ id: Date.now(), name: 'Nueva Materia', evals: [] });
                saveData();
            }
        }

        function deleteSubject(semId, subId) {
            if(confirm("✨ ¿Seguro que deseas eliminar esta materia?")) {
                const sem = graderData.find(s => s.id === semId);
                if(sem) sem.subjects = sem.subjects.filter(sub => sub.id !== subId);
                saveData();
            }
        }

        function updateSubjectName(semId, subId, newName) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) sub.name = newName;
            }
            saveData();
        }

        // --- CRUD EVALUACIONES ---
        function addEval(semId, subId) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) sub.evals.push({ id: Date.now(), name: 'Evaluación', weight: 0, grade: 0 });
            }
            saveData();
        }

        function updateEval(semId, subId, evalId, field, value) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) {
                    const ev = sub.evals.find(e => e.id === evalId);
                    if(ev) ev[field] = field === 'name' ? value : parseFloat(value) || 0;
                }
            }
            saveData();
        }

        function deleteEval(semId, subId, evalId) {
            const sem = graderData.find(s => s.id === semId);
            if(sem) {
                const sub = sem.subjects.find(s => s.id === subId);
                if(sub) sub.evals = sub.evals.filter(e => e.id !== evalId);
            }
            saveData();
        }

        // --- RENDERIZADO Y CÁLCULOS ---
        function render() {
            const container = document.getElementById('semestersContainer');
            container.innerHTML = '';

            let globalTotalGrades = 0;
            let globalSubjectCount = 0;

            if (graderData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#7b68ee;">El cielo nocturno está vacío. Agrega un semestre para comenzar.</p>';
            }

            graderData.forEach(sem => {
                const semBlock = document.createElement('div');
                semBlock.className = 'semester-block';
                
                let semTotalGrades = 0;
                let semSubjectCount = sem.subjects.length;

                let subjectsHtml = '';

                sem.subjects.forEach(sub => {
                    let totalGrade = 0;
                    let totalWeight = 0;

                    let evalsHtml = sub.evals.map(ev => {
                        let calcGrade = (ev.grade * (ev.weight / 100));
                        totalGrade += calcGrade;
                        totalWeight += ev.weight;
                        
                        return `
                            <div class="eval-row">
                                <input type="text" value="${ev.name}" onchange="updateEval(${sem.id}, ${sub.id}, ${ev.id}, 'name', this.value)">
                                <input type="number" value="${ev.weight}" onchange="updateEval(${sem.id}, ${sub.id}, ${ev.id}, 'weight', this.value)" placeholder="Peso %" min="0" max="100">
                                <input type="number" value="${ev.grade}" onchange="updateEval(${sem.id}, ${sub.id}, ${ev.id}, 'grade', this.value)" placeholder="Nota (0-20)" step="0.1" min="0" max="20">
                                <button class="btn btn-danger" onclick="deleteEval(${sem.id}, ${sub.id}, ${ev.id})">✖</button>
                            </div>
                        `;
                    }).join('');

                    semTotalGrades += totalGrade;
                    globalTotalGrades += totalGrade;
                    globalSubjectCount++;

                    // Logica visual de la barra
                    let barClass = 'progress-fill';
                    if (totalWeight > 100) barClass += ' over';
                    else if (totalWeight === 100) barClass += ' complete';
                    
                    let gradeClass = totalGrade >= 9.5 ? 'grade-good' : (totalGrade >= 5 ? 'grade-warning' : 'grade-danger');

                    subjectsHtml += `
                        <div class="subject-card">
                            <div class="subject-header">
                                <input type="text" value="${sub.name}" onchange="updateSubjectName(${sem.id}, ${sub.id}, this.value)">
                                <button class="btn btn-danger" onclick="deleteSubject(${sem.id}, ${sub.id})">Eliminar Materia</button>
                            </div>
                            <button class="btn btn-add-eval" onclick="addEval(${sem.id}, ${sub.id})">+ Añadir Evaluación</button>
                            
                            <div class="evals-container">
                                ${evalsHtml}
                            </div>
                            
                            <div class="progress-container" title="Porcentaje evaluado: ${totalWeight.toFixed(1)}%">
                                <div class="${barClass}" style="width: ${Math.min(totalWeight, 100)}%;"></div>
                            </div>
                            
                            <div class="summary">
                                <span>Progreso: <span style="color: ${totalWeight > 100 ? '#ff4500' : '#fff'}">${totalWeight.toFixed(1)}% / 100%</span></span>
                                <span>Nota Acumulada: <strong class="${gradeClass}">${totalGrade.toFixed(2)} / 20</strong></span>
                            </div>
                        </div>
                    `;
                });

                // Calculo del promedio del semestre (suma de definitivas / cant de materias)
                let semGpa = semSubjectCount > 0 ? (semTotalGrades / semSubjectCount) : 0;

                semBlock.innerHTML = `
                    <div class="semester-header">
                        <input type="text" value="${sem.name}" onchange="updateSemesterName(${sem.id}, this.value)">
                        <div class="semester-gpa">Promedio Semestre: <strong>${semGpa.toFixed(2)}</strong></div>
                        <button class="btn btn-danger" onclick="deleteSemester(${sem.id})">Eliminar Semestre</button>
                    </div>
                    ${subjectsHtml}
                    <button class="btn btn-add-sub" onclick="addSubject(${sem.id})">+ Agregar Materia a este Semestre</button>
                `;
                container.appendChild(semBlock);
            });

            // Calculo del promedio global general
            let globalGpa = globalSubjectCount > 0 ? (globalTotalGrades / globalSubjectCount) : 0;
            document.getElementById('globalGpaDisplay').innerText = `${globalGpa.toFixed(2)} / 20`;
        }

        // Render inicial
        render();
    </script>
</body>
</html>
